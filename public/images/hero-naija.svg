<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#041a0f"/>
      <stop offset="40%" style="stop-color:#0a2f1c"/>
      <stop offset="100%" style="stop-color:#048b4e"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#025932"/>
      <stop offset="100%" style="stop-color:#013d22"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#1abc9c" stop-opacity="0.35"/>
      <stop offset="100%" style="stop-color:#1abc9c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b" stop-opacity="0"/>
      <stop offset="50%" style="stop-color:#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" style="stop-color:#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <!-- stadium arc silhouette -->
  <ellipse cx="1400" cy="900" rx="700" ry="280" fill="#022c1a" opacity="0.8"/>
  <path d="M700 780 Q1400 420 1920 700 L1920 1080 L700 1080 Z" fill="#034d2c" opacity="0.5"/>
  <!-- pitch lines perspective -->
  <g stroke="#1abc9c" stroke-width="2" opacity="0.25" fill="none">
    <ellipse cx="1400" cy="880" rx="480" ry="160"/>
    <ellipse cx="1400" cy="880" rx="200" ry="70"/>
    <line x1="1400" y1="720" x2="1400" y2="1040"/>
  </g>
  <!-- floating orbs / network nodes suggesting digital ecosystem -->
  <g fill="#1abc9c">
    <circle cx="280" cy="220" r="6" opacity="0.8"/>
    <circle cx="420" cy="180" r="4" opacity="0.6"/>
    <circle cx="360" cy="320" r="5" opacity="0.7"/>
    <circle cx="520" cy="260" r="3" opacity="0.5"/>
    <circle cx="200" cy="400" r="4" opacity="0.6"/>
  </g>
  <g stroke="#1abc9c" stroke-width="1.5" opacity="0.3">
    <line x1="280" y1="220" x2="420" y2="180"/>
    <line x1="280" y1="220" x2="360" y2="320"/>
    <line x1="360" y1="320" x2="520" y2="260"/>
    <line x1="280" y1="220" x2="200" y2="400"/>
  </g>
  <!-- Nigerian flag stripe accent left -->
  <rect x="0" y="0" width="12" height="1080" fill="#048b4e"/>
  <rect x="12" y="0" width="12" height="1080" fill="#ffffff"/>
  <rect x="24" y="0" width="12" height="1080" fill="#048b4e"/>
  <!-- gold accent line -->
  <rect x="0" y="980" width="1920" height="3" fill="url(#gold)"/>
  <!-- abstract football -->
  <circle cx="1650" cy="280" r="90" fill="none" stroke="white" stroke-width="3" opacity="0.15"/>
  <circle cx="1650" cy="280" r="50" fill="none" stroke="white" stroke-width="2" opacity="0.12"/>
  <!-- subtle grid -->
  <g stroke="white" stroke-width="0.5" opacity="0.04">
    <line x1="0" y1="0" x2="0" y2="1080"/>
<line x1="80" y1="0" x2="80" y2="1080"/>
<line x1="160" y1="0" x2="160" y2="1080"/>
<line x1="240" y1="0" x2="240" y2="1080"/>
<line x1="320" y1="0" x2="320" y2="1080"/>
<line x1="400" y1="0" x2="400" y2="1080"/>
<line x1="480" y1="0" x2="480" y2="1080"/>
<line x1="560" y1="0" x2="560" y2="1080"/>
<line x1="640" y1="0" x2="640" y2="1080"/>
<line x1="720" y1="0" x2="720" y2="1080"/>
<line x1="800" y1="0" x2="800" y2="1080"/>
<line x1="880" y1="0" x2="880" y2="1080"/>
<line x1="960" y1="0" x2="960" y2="1080"/>
<line x1="1040" y1="0" x2="1040" y2="1080"/>
<line x1="1120" y1="0" x2="1120" y2="1080"/>
<line x1="1200" y1="0" x2="1200" y2="1080"/>
<line x1="1280" y1="0" x2="1280" y2="1080"/>
<line x1="1360" y1="0" x2="1360" y2="1080"/>
<line x1="1440" y1="0" x2="1440" y2="1080"/>
<line x1="1520" y1="0" x2="1520" y2="1080"/>
<line x1="1600" y1="0" x2="1600" y2="1080"/>
<line x1="1680" y1="0" x2="1680" y2="1080"/>
<line x1="1760" y1="0" x2="1760" y2="1080"/>
<line x1="1840" y1="0" x2="1840" y2="1080"/>
  </g>
</svg>