<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#365314"/>
      <stop offset="100%" style="stop-color:#1a2e05"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a67c52"/>
      <stop offset="100%" style="stop-color:#a67c52" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- subtle pattern -->
  <circle cx="320" cy="80" r="100" fill="white" opacity="0.06"/>
  <circle cx="60" cy="340" r="80" fill="white" opacity="0.05"/>
  <!-- head silhouette stylized -->
  <ellipse cx="200" cy="155" rx="70" ry="75" fill="url(#skin)"/>
  <ellipse cx="200" cy="360" rx="110" ry="100" fill="url(#skin)"/>
  <!-- initials badge -->
  <circle cx="200" cy="200" r="48" fill="rgba(0,0,0,0.25)"/>
  <text x="200" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="36" font-weight="800" fill="white">EC</text>
  <!-- Nigeria green ring -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="#1abc9c" stroke-width="6" opacity="0.4"/>
</svg>